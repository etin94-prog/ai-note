<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="가족 학원 일정·학원비 납부·환불 기록" />
    <meta name="theme-color" content="#F4F6FA" />

    <!-- 글꼴: Pretendard (한글 가변 글꼴, 필요한 글자만 내려받음). 오프라인이면 기기 기본 글꼴로 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

    <!-- PWA: 홈 화면 설치 (D-10, X-12). 경로는 GitHub Pages 하위 경로 /ai-note 기준 -->
    <link rel="manifest" href="/ai-note/manifest.json" />
    <link rel="icon" type="image/png" href="/ai-note/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/ai-note/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="학원노트" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- react-native-web 권장 기본 스타일 -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- 디자인 기본 (Taste 점검 10-10): 한글 줄바꿈·숫자·포커스 -->
    <style id="app-base">
      body {
        font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
        background: #f4f6fa;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      /* 한국어: 낱말 중간에서 끊지 않고, 마지막 줄에 한 글자만 남지 않게 */
      #root [dir] {
        word-break: keep-all;
        overflow-wrap: anywhere;
        text-wrap: pretty;
      }
      /* 키보드로 이동할 때 지금 위치가 보이게 */
      :focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
        border-radius: 6px;
      }
      input:focus-visible,
      textarea:focus-visible {
        outline: none;
      }
    </style>

    <!-- 서비스워커: 배포 빌드에서만 (오프라인 재실행, Q-16) -->
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        // 새 버전 서비스워커가 적용되면 한 번 새로고침해 새 화면을 띄운다
        var hadController = !!navigator.serviceWorker.controller;
        var reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController || reloaded) return;
          reloaded = true;
          location.reload();
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/ai-note/sw.js', { scope: '/ai-note/' })
            .then(function (reg) {
              reg.update();
              // 앱을 다시 볼 때마다 새 버전 확인 (홈 화면 앱은 오래 켜져 있을 수 있음)
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') reg.update();
              });
            })
            .catch(function () {});
        });
      }
    </script>
  </head>

  <body>
    <noscript>이 앱을 쓰려면 JavaScript를 켜 주세요.</noscript>
    <div id="root"></div>
  </body>
</html>
